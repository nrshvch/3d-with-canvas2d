<meta charset="utf-8">
<title>option 6 vs 8b, pixel diff</title>
<style>body{background:#14141a;color:#d8d8e0;font:12px/1.5 ui-monospace,Consolas,monospace;margin:10px}</style>
<pre id="out">running…</pre>
<script src="harness.js"></script>
<script src="cube.js"></script>
<script src="band.js"></script>
<script>
'use strict';
// ---------------------------------------------------------------------------
// bench/optgeom.mjs proves that option 6's emitted loop and option 8b's are
// the same region (identical area, symmetric difference 0.063 px2 of a
// 113 483 px2 union -- 8b's loop is 6's plus two vertices that are collinear
// to 0.002 px).  The measured rows disagree wildly (S14 outline 11.36 against
// 0.42).  Both cannot be true, so: render the pair and diff the pixels.
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const TAG = Q.get('tag') || 'diff';
const out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; };
const raf = () => new Promise(r => requestAnimationFrame(r));

function mk(W, H) { return mkCanvas(W, H, { alpha: false, willReadFrequently: true }); }
function render(c, W, H, prepare, draw, bg) {
  prepare();
  c.ctx.setTransform(1, 0, 0, 1, 0, 0);
  c.ctx.fillStyle = bg; c.ctx.fillRect(0, 0, W, H);
  draw(c.ctx, null);
  c.ctx.setTransform(1, 0, 0, 1, 0, 0);
  return c.ctx.getImageData(0, 0, W, H).data;
}
function diff(a, b) {
  let n = 0, g1 = 0, g8 = 0, mx = 0, sum = 0;
  for (let i = 0; i < a.length; i += 4) {
    const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]));
    if (d > 0) { n++; sum += d; }
    if (d > 1) g1++;
    if (d > 8) g8++;
    if (d > mx) mx = d;
  }
  return { anyPx: n, gt1: g1, gt8: g8, maxDelta: mx, meanOverDiff: n ? +(sum / n).toFixed(2) : 0 };
}

async function main() {
  out.textContent = '';
  log(navigator.userAgent + '\n');

  // ---- S14 ----------------------------------------------------------------
  {
    const W = BW, H = BH;
    const A = mk(W, H), B = mk(W, H);
    const prep = () => bandBuild(1);
    const a = render(A, W, H, prep, (c, s) => bandOutset(c, s, 1.0, 4), '#101014');
    const b = render(B, W, H, prep, (c, s) => bandOptNeighbourMitred(c, s, 1.0, 4), '#101014');
    log('S14  option 6 (bandOutset 1px) vs option 8b (mitred 1px):');
    log('     ' + JSON.stringify(diff(a, b)));
    // and each against the plain fill, which is what `outline` is measured from
    const C = mk(W, H);
    const base = render(C, W, H, prep, (c, s) => bandFillOnly(c, s), '#101014');
    log('     option 6  vs plain fill: ' + JSON.stringify(diff(base, a)));
    log('     option 8b vs plain fill: ' + JSON.stringify(diff(base, b)));
    for (const c of [A, B, C]) c.c.width = c.c.height = 1;
  }
  await raf();

  // ---- S8 -----------------------------------------------------------------
  {
    const W = CW, H = CH;
    const ANG = [0.55, 0.72, 3.4, 620];
    const prep = () => cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]);
    const A = mk(W, H), B = mk(W, H), C = mk(W, H);
    const a = render(A, W, H, prep, (c, s) => drawPerFace(c, s, 1.0), '#101014');
    const b = render(B, W, H, prep, (c, s) => optNeighbourBandMitred(c, s, 1.0, 4), '#101014');
    const base = render(C, W, H, prep, (c, s) => drawPerFace(c, s, 0), '#101014');
    log('\nS8   option 6 (outset 1px) vs option 8b (mitred 1px):');
    log('     ' + JSON.stringify(diff(a, b)));
    log('     option 6  vs plain fill: ' + JSON.stringify(diff(base, a)));
    log('     option 8b vs plain fill: ' + JSON.stringify(diff(base, b)));
    for (const c of [A, B, C]) c.c.width = c.c.height = 1;
  }

  log('\nDONE');
  await post(TAG, { env: { tag: TAG, ua: navigator.userAgent }, micro: [{ name: 'done' }],
                    notes: [{ case: 'text', text: out.textContent }] });
}
window.addEventListener('load', () => setTimeout(() => main().catch(e => {
  log('ERROR ' + e + '\n' + e.stack);
  post(TAG, { error: String(e), micro: [{}] });
}), 100));
</script>
