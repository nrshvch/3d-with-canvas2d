[package]
name = "wgr-shim"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wpf-gpu-raster = { path = "vendor/wpf-gpu-raster", default-features = false }
aa-stroke = { path = "vendor/aa-stroke", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
