<meta charset="utf-8">
<title>one fill per face, no gaps</title>
<style>
  body { background:#14141a; color:#d8d8e0; font:12px/1.4 ui-monospace,Consolas,monospace; margin:10px; }
  #status { color:#fd8; }
  canvas.pv { border:1px solid #333; width:340px; height:238px; }
  .lbl { color:#8fd; margin-top:8px; }
</style>
<div id="status">booting…</div>
<pre id="out"></pre>
<div id="previews"></div>
<script src="harness.js"></script>
<script src="cube.js"></script>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Gaps are measured, not eyeballed.  Render the same frame twice with a BLACK
// and a WHITE background: a fully covered pixel comes out identical both
// times, and a pixel with background bleeding through differs by exactly the
// bleed fraction times 255.  So
//        beta = |white - black| / 255
// is the missing coverage at that pixel, exactly.  Restricted to pixels that
// a single-fill silhouette mask says are strictly interior, the sum of beta is
// the total gap area in pixels.  Zero means no gaps.
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const TAG = Q.get('tag') || 'cube';
const out = document.getElementById('out'), statusEl = document.getElementById('status');
const log = s => { out.textContent += s + '\n'; };
const pad = (s, n) => { s = String(s); while (s.length < n) s += ' '; return s; };
const rp = (s, n) => { s = String(s); while (s.length < n) s = ' ' + s; return s; };
const raf = () => new Promise(r => requestAnimationFrame(r));
const W = CW, H = CH;

function minRounds(f, rounds, iters) {
  let best = Infinity;
  for (let r = 0; r < rounds; r++) {
    const t0 = performance.now();
    for (let i = 0; i < iters; i++) f();
    const ms = (performance.now() - t0) / iters;
    if (ms < best) best = ms;
  }
  return best;
}
function fillBG(ctx, css) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = css; ctx.fillRect(0, 0, W, H); }

// silhouette: every visible face as a subpath of ONE path, one fill -> no
// internal seams anywhere, so this is an exact solid mask of the union
function silhouetteMask(ctx) {
  fillBG(ctx, '#000');
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  for (let i = 0; i < nFaceVis; i++) {
    const q = CUBE_F[FORD[i]];
    ctx.moveTo(SX[q[0]], SY[q[0]]);
    ctx.lineTo(SX[q[1]], SY[q[1]]);
    ctx.lineTo(SX[q[2]], SY[q[2]]);
    ctx.lineTo(SX[q[3]], SY[q[3]]);
  }
  ctx.fill();
}

function measureGaps(draw, angle) {
  const mk = () => mkCanvas(W, H, { alpha: false, willReadFrequently: true });
  const mC = mk(), bC = mk(), wC = mk();
  cubeBuild(angle[0], angle[1], angle[2], angle[3]);
  silhouetteMask(mC.ctx);
  cubeBuild(angle[0], angle[1], angle[2], angle[3]);
  fillBG(bC.ctx, '#000'); draw(bC.ctx, null);
  cubeBuild(angle[0], angle[1], angle[2], angle[3]);
  fillBG(wC.ctx, '#fff'); draw(wC.ctx, null);
  const m = mC.ctx.getImageData(0, 0, W, H).data;
  const b = bC.ctx.getImageData(0, 0, W, H).data;
  const wd = wC.ctx.getImageData(0, 0, W, H).data;
  // A pixel on the object's outer silhouette is only PARTLY covered, and that
  // is correct antialiasing, not a gap -- but the union mask is fully opaque
  // one pixel further in, so the raw metric still catches a ring of them.
  // Erode the mask by R so only pixels well away from the silhouette count;
  // interior seams are then all that is left.
  const R = 2;
  let area = 0, px = 0, worst = 0, inside = 0;
  let areaE = 0, pxE = 0, worstE = 0, insideE = 0;
  const solid = (x, y) => { const i = (y * W + x) * 4; return m[i] === 255 && m[i + 1] === 255 && m[i + 2] === 255; };
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (!(m[i] === 255 && m[i + 1] === 255 && m[i + 2] === 255)) continue;
      inside++;
      const d = Math.max(Math.abs(wd[i] - b[i]), Math.abs(wd[i + 1] - b[i + 1]), Math.abs(wd[i + 2] - b[i + 2]));
      const beta = d / 255;
      if (beta > 0.02) { px++; area += beta; }
      if (beta > worst) worst = beta;
      let er = x >= R && y >= R && x < W - R && y < H - R;
      for (let dy = -R; er && dy <= R; dy++) for (let dx = -R; er && dx <= R; dx++) if (!solid(x + dx, y + dy)) er = false;
      if (!er) continue;
      insideE++;
      if (beta > 0.02) { pxE++; areaE += beta; }
      if (beta > worstE) worstE = beta;
    }
  }
  for (const c of [mC, bC, wC]) { c.c.width = c.c.height = 1; }
  return { gapPx: px, gapArea: +area.toFixed(1), worst: +worst.toFixed(3), inside,
           gapPxE: pxE, gapAreaE: +areaE.toFixed(1), worstE: +worstE.toFixed(3), insideE };
}

async function main() {
  const lease = await fetch('/lease?tag=' + encodeURIComponent(TAG)).then(r => r.json()).catch(() => ({ granted: true }));
  if (!lease.granted) { statusEl.textContent = 'duplicate instance'; return; }
  setInterval(() => fetch('/beat?tag=' + encodeURIComponent(TAG)).catch(() => { }), 5000);
  const RES = { env: { tag: TAG, ua: navigator.userAgent }, scenes: [], micro: [], notes: [] };
  log('TAG ' + TAG + '\n' + navigator.userAgent);
  log('\ntextured cube, ' + W + 'x' + H + ', padded 512x512 atlas, 3 visible faces');
  log('gap area is measured exactly (black/white background differencing),');
  log('restricted to strictly interior pixels. 0.0 means no gaps at all.\n');

  // Is the test atlas itself fully opaque?  If not, an "interior gap" is my
  // fixture leaking, not the renderer.
  {
    const t = mkCanvas(CTEX, CTEX, { alpha: true, willReadFrequently: true });
    t.ctx.drawImage(CUBE_TEXTURE, 0, 0);
    const d = t.ctx.getImageData(0, 0, CTEX, CTEX).data;
    let minA = 255, nLt = 0, sumMissing = 0;
    for (let i = 3; i < d.length; i += 4) {
      if (d[i] < minA) minA = d[i];
      if (d[i] < 255) { nLt++; sumMissing += (255 - d[i]) / 255; }
    }
    log('atlas opacity: min alpha ' + minA + ', ' + nLt + ' of ' + (CTEX * CTEX) +
        ' texels below 255, total missing alpha ' + sumMissing.toFixed(1) + ' texels');
    RES.notes.push({ case: 'atlas opacity', gapPx: nLt, gapArea: +sumMissing.toFixed(1), worst: minA });
    t.c.width = t.c.height = 1;
  }

  const ANG = [0.55, 0.72, 3.4, 620];
  const gpu = mkCanvas(W, H, { alpha: false });

  const CASES = [
    ['a per-tri  clip+drawImage', (c, s) => drawPerTriClip(c, s)],
    ['b per-tri  pattern fill', (c, s) => drawPerTriPattern(c, s)],
    ['c per-FACE pattern, no outset', (c, s) => drawPerFace(c, s, 0)],
    ['d per-FACE + outset 0.5px', (c, s) => drawPerFace(c, s, 0.5)],
    ['e per-FACE + outset 1.0px', (c, s) => drawPerFace(c, s, 1.0)],
    ['e2 per-FACE + outset 2.0px', (c, s) => drawPerFace(c, s, 2.0)],
    ['e3 per-FACE + outset 4.0px', (c, s) => drawPerFace(c, s, 4.0)],
    ['f per-FACE + stroke (rejected)', (c, s) => drawPerFaceStroke(c, s)]
  ];

  cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]);
  log('visible faces: ' + nFaceVis + '  order ' + Array.from(FORD.slice(0, nFaceVis)).join(',') +
      '  (adjacency: ' + CUBE_ADJ.map(a => '[' + a + ']').join(' ') + ')');
  {
    let outsetEdges = 0;
    for (let i = 0; i < nFaceVis; i++) {
      const f = FORD[i];
      for (let e = 0; e < 4; e++) {
        const nb = CUBE_ADJ[f][e];
        if (nb >= 0 && FVIS[nb] && FPOS[nb] > FPOS[f]) outsetEdges++;
      }
    }
    let sharedVisible = 0;
    for (let i = 0; i < nFaceVis; i++) {
      const f = FORD[i];
      for (let e = 0; e < 4; e++) { const nb = CUBE_ADJ[f][e]; if (nb >= 0 && FVIS[nb]) sharedVisible++; }
    }
    log('edges shared between two VISIBLE faces: ' + (sharedVisible / 2) +
        ';  edges actually outset: ' + outsetEdges);
  }
  log('');
  log(pad('strategy', 32) + rp('ops', 5) + rp('recMs', 9) + rp('perDraw', 10) +
      rp('gapPx', 8) + rp('gapArea', 9) + rp('worst', 8) +
      '   | interior only (silhouette eroded):' + rp('gapPx', 8) + rp('gapArea', 9) + rp('worst', 8));
  const rows = [];
  for (const [label, draw] of CASES) {
    statusEl.textContent = label;
    await raf();
    const st = {};
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]);
    draw(gpu.ctx, st);
    const one = () => { cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); fillBG(gpu.ctx, '#101014'); draw(gpu.ctx, null); };
    for (let i = 0; i < 4; i++) one();
    const rec = minRounds(one, 5, 40);
    await raf();
    // GPU-inclusive: many draws per rAF callback so the frame is far above vsync
    const reps = Math.max(8, Math.min(2048, Math.ceil(50 / Math.max(rec, 0.02))));
    const per = await new Promise(resolve => {
      let warm = 6, t0 = 0, cnt = 0, done = false;
      const wd = setTimeout(() => { if (!done) { done = true; resolve(NaN); } }, 60000);
      function step(ts) {
        if (done) return;
        if (warm > 0) { warm--; if (warm === 0) { t0 = ts; cnt = 0; } }
        for (let k = 0; k < reps; k++) one();
        if (warm === 0) cnt++;
        if (warm === 0 && cnt >= 20) { done = true; clearTimeout(wd); resolve((ts - t0) / (cnt * reps)); return; }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
    const g = measureGaps(draw, ANG);
    const row = { case: label, ops: st.ops, recMs: +rec.toFixed(4), perDrawMs: +per.toFixed(4),
                  gapPx: g.gapPx, gapArea: g.gapArea, worst: g.worst, insidePx: g.inside,
                  gapPxE: g.gapPxE, gapAreaE: g.gapAreaE, worstE: g.worstE, insidePxE: g.insideE };
    rows.push(row); RES.notes.push(row);
    log(pad(label, 32) + rp(st.ops, 5) + rp(rec.toFixed(3), 9) + rp(per.toFixed(3), 10) +
        rp(g.gapPx, 8) + rp(g.gapArea, 9) + rp(g.worst, 8) +
        '   |                                  ' + rp(g.gapPxE, 8) + rp(g.gapAreaE, 9) + rp(g.worstE, 8));
    await raf();
  }
  RES.scenes.push({ name: 'textured cube', nVis: nFaceVis, rows });

  // does the outset shift the visible boundary?  compare against no-outset
  {
    const A = mkCanvas(W, H, { alpha: false, willReadFrequently: true });
    const B = mkCanvas(W, H, { alpha: false, willReadFrequently: true });
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); fillBG(A.ctx, '#101014'); drawPerFace(A.ctx, null, 0);
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); fillBG(B.ctx, '#101014'); drawPerFace(B.ctx, null, 0.5);
    const a = A.ctx.getImageData(0, 0, W, H).data, b = B.ctx.getImageData(0, 0, W, H).data;
    let n = 0, g16 = 0, mx = 0;
    for (let i = 0; i < a.length; i += 4) {
      const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]));
      if (d > 0) n++;
      if (d > 16) g16++;
      if (d > mx) mx = d;
    }
    log('\noutset 0.5px vs none: ' + n + ' pixels changed, ' + g16 + ' by >16, max ' + mx);
    log('(changes should be confined to the shared edges, which is where the gap was)');
    RES.notes.push({ case: 'outset delta', gapPx: n, gapArea: g16, worst: mx });
  }

  // localise the residual: distance of each leaking pixel to the three shared
  // edges and to the silhouette, plus a coarse spatial histogram
  {
    const mk = () => mkCanvas(W, H, { alpha: false, willReadFrequently: true });
    const mC = mk(), bC = mk(), wC = mk();
    const draw = (c, s) => drawPerFace(c, s, 1.0);
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); silhouetteMask(mC.ctx);
    // collect the 3 shared edges as screen segments
    const segs = [];
    for (let i = 0; i < nFaceVis; i++) {
      const f = FORD[i], q = CUBE_F[f];
      for (let e = 0; e < 4; e++) {
        const nb = CUBE_ADJ[f][e];
        if (nb >= 0 && FVIS[nb] && FPOS[nb] > FPOS[f])
          segs.push([SX[q[e]], SY[q[e]], SX[q[(e + 1) % 4]], SY[q[(e + 1) % 4]]]);
      }
    }
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); fillBG(bC.ctx, '#000'); draw(bC.ctx, null);
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); fillBG(wC.ctx, '#fff'); draw(wC.ctx, null);
    const m = mC.ctx.getImageData(0, 0, W, H).data;
    const b = bC.ctx.getImageData(0, 0, W, H).data;
    const wdt = wC.ctx.getImageData(0, 0, W, H).data;
    const segDist = (x, y) => {
      let best = 1e9;
      for (const s2 of segs) {
        const dx = s2[2] - s2[0], dy = s2[3] - s2[1];
        const L2 = dx * dx + dy * dy || 1;
        let t = ((x - s2[0]) * dx + (y - s2[1]) * dy) / L2;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const px2 = s2[0] + t * dx - x, py2 = s2[1] + t * dy - y;
        const d2 = px2 * px2 + py2 * py2;
        if (d2 < best) best = d2;
      }
      return Math.sqrt(best);
    };
    let near = 0, nearArea = 0, far = 0, farArea = 0;
    let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
    const hist = new Float64Array(70);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (!(m[i] === 255 && m[i + 1] === 255 && m[i + 2] === 255)) continue;
      const d = Math.max(Math.abs(wdt[i] - b[i]), Math.abs(wdt[i + 1] - b[i + 1]), Math.abs(wdt[i + 2] - b[i + 2]));
      const beta = d / 255;
      if (beta <= 0.02) continue;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      hist[(((y * 7 / H) | 0) * 10) + ((x * 10 / W) | 0)] += beta;
      if (segDist(x, y) <= 3) { near++; nearArea += beta; } else { far++; farArea += beta; }
    }
    log('');
    log('residual gap localisation (outset 1.0px):');
    log('  within 3px of a shared edge: ' + near + ' px, area ' + nearArea.toFixed(1));
    log('  elsewhere:                   ' + far + ' px, area ' + farArea.toFixed(1));
    log('  bbox x ' + minx + '..' + maxx + '  y ' + miny + '..' + maxy);
    log('  spatial histogram of leak area (10x7 over the canvas):');
    for (let r = 0; r < 7; r++) {
      let line = '   ';
      for (let c2 = 0; c2 < 10; c2++) { const v = hist[r * 10 + c2]; line += rp(v < 0.05 ? '.' : v.toFixed(0), 6); }
      log(line);
    }
    // how far is each leaking pixel from the edge of the union mask?  If the
    // answer is "1-3 px" it is the object's own silhouette and not a gap at all.
    const distHist = new Float64Array(12);
    const solidAt = (x, y) => {
      if (x < 0 || y < 0 || x >= W || y >= H) return false;
      const i = (y * W + x) * 4;
      return m[i] === 255 && m[i + 1] === 255 && m[i + 2] === 255;
    };
    const maskDist = (x, y) => {
      for (let r = 1; r <= 10; r++) {
        for (let dx = -r; dx <= r; dx++) {
          if (!solidAt(x + dx, y - r) || !solidAt(x + dx, y + r)) return r;
        }
        for (let dy = -r; dy <= r; dy++) {
          if (!solidAt(x - r, y + dy) || !solidAt(x + r, y + dy)) return r;
        }
      }
      return 11;
    };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (!solidAt(x, y)) continue;
      const d = Math.max(Math.abs(wdt[i] - b[i]), Math.abs(wdt[i + 1] - b[i + 1]), Math.abs(wdt[i + 2] - b[i + 2]));
      const beta = d / 255;
      if (beta <= 0.02) continue;
      distHist[Math.min(11, maskDist(x, y))] += beta;
    }
    log('  leak area by distance from the mask edge (1..10, 11=deeper):');
    log('    ' + Array.from(distHist).map((v, i2) => i2 + ':' + v.toFixed(1)).join('  '));
    let hs = '';
    for (let r = 0; r < 7; r++) { for (let c2 = 0; c2 < 10; c2++) { const v = hist[r * 10 + c2]; hs += (v < 0.05 ? '.' : Math.min(9, Math.round(v / 3))); } hs += '/'; }
    RES.notes.push({ case: 'localise', gapPx: near, gapArea: +nearArea.toFixed(1), worst: far,
                     insidePx: +farArea.toFixed(1),
                     bbox: minx + ',' + miny + ' .. ' + maxx + ',' + maxy, hist: hs,
                     distHist: Array.from(distHist).map(v => +v.toFixed(1)).join(','),
                     silhouetteSegs: segs.length });
    for (const c of [mC, bC, wC]) { c.c.width = c.c.height = 1; }
  }

  // where does the residual gap actually live?  render beta amplified.
  {
    const mk = () => mkCanvas(W, H, { alpha: false, willReadFrequently: true });
    const mC = mk(), bC = mk(), wC = mk();
    const draw = (c, s) => drawPerFace(c, s, 1.0);
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); silhouetteMask(mC.ctx);
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); fillBG(bC.ctx, '#000'); draw(bC.ctx, null);
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]); fillBG(wC.ctx, '#fff'); draw(wC.ctx, null);
    const m = mC.ctx.getImageData(0, 0, W, H).data;
    const b = bC.ctx.getImageData(0, 0, W, H).data;
    const wdt = wC.ctx.getImageData(0, 0, W, H).data;
    const map = mkCanvas(W, H, { alpha: false });
    const img = map.ctx.createImageData(W, H);
    const o = img.data;
    for (let i = 0; i < m.length; i += 4) {
      const interior = (m[i] === 255 && m[i + 1] === 255 && m[i + 2] === 255);
      const d = Math.max(Math.abs(wdt[i] - b[i]), Math.abs(wdt[i + 1] - b[i + 1]), Math.abs(wdt[i + 2] - b[i + 2]));
      const v = Math.min(255, d * 4);
      o[i] = interior ? v : 0;
      o[i + 1] = interior ? 0 : (m[i] ? 40 : 0);
      o[i + 2] = 0; o[i + 3] = 255;
    }
    map.ctx.putImageData(img, 0, 0);
    map.c.className = 'pv';
    const lab = document.createElement('div'); lab.className = 'lbl';
    lab.textContent = 'residual gap map, outset 1.0px (red = interior bleed x4, dim green = mask)';
    document.getElementById('previews').appendChild(lab);
    document.getElementById('previews').appendChild(map.c);
    for (const c of [mC, bC, wC]) { c.c.width = c.c.height = 1; }
  }

  const pv = document.getElementById('previews');
  for (const [label, draw] of CASES) {
    cubeBuild(ANG[0], ANG[1], ANG[2], ANG[3]);
    const c = mkCanvas(W, H, { alpha: false });
    c.c.className = 'pv';
    fillBG(c.ctx, '#ff00ff');            // magenta: any gap is unmistakable
    draw(c.ctx, null);
    const d = document.createElement('div'); d.className = 'lbl'; d.textContent = label;
    pv.appendChild(d); pv.appendChild(c.c);
  }

  statusEl.textContent = 'DONE';
  RES.micro.push({ name: 'complete', recMs: 0, rasterMs: 0 });
  await post(TAG, RES);
  log('\nposted as ' + TAG);
}
window.addEventListener('load', () => setTimeout(() => main().catch(e => {
  statusEl.textContent = 'ERROR ' + e; log(String(e) + '\n' + e.stack);
  post(TAG, { error: String(e), micro: [{}] });
}), 120));
</script>
