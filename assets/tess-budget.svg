<svg xmlns="http://www.w3.org/2000/svg" width="640" height="406" viewBox="0 0 640 406" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="406" fill="#f7f7fa"/><text x="12" y="22" font-size="14" fill="#1c1c22" font-weight="bold">A frame's tessellated output, per seam repair, against Firefox's 4 MB buffer</text><text x="12" y="40" font-size="10.5" fill="#8a8a96">Counted through Firefox 156's own tessellators on S1–S3 (WGR for fills, aa-stroke for strokes). The stroke's share</text><text x="12" y="54" font-size="10.5" fill="#8a8a96">is aa-stroke's model, good to about ±20 % (T67). The dashed line is gpu-path-size = 4 MB: past it a still frame demotes.</text><rect x="8.0" y="70.0" width="624.0" height="84.0" fill="#fff" fill-opacity="1"/><text x="16" y="86" font-size="11.5" fill="#1c1c22" font-weight="bold">S1 torusKnot</text><text x="16" y="104" font-size="10" fill="#1c1c22">no repair</text><rect x="190.0" y="94.0" width="154.4" height="13.0" fill="#c7d7ee" fill-opacity="1"/><text x="348.41134071616955" y="104" font-size="10" fill="#1c1c22">4.37×</text><text x="16" y="123" font-size="10" fill="#1c1c22">in-line band (the default)</text><rect x="190.0" y="113.0" width="162.6" height="13.0" fill="#c7d7ee" fill-opacity="1"/><rect x="344.4" y="113.0" width="8.2" height="13.0" fill="#e08a10" fill-opacity="0.8"/><text x="356.61763929311724" y="123" font-size="10" fill="#1c1c22">4.60×</text><text x="16" y="142" font-size="10" fill="#1c1c22">0.5 px seam stroke (C1)</text><rect x="190.0" y="132.0" width="154.4" height="13.0" fill="#c7d7ee" fill-opacity="1"/><rect x="344.4" y="132.0" width="193.8" height="13.0" fill="#c0504d" fill-opacity="0.75"/><text x="542.1874216623218" y="142" font-size="10" fill="#1c1c22">9.85×</text><path d="M225.4 90 V150" stroke="#1c1c22" stroke-dasharray="3 3"/><rect x="8.0" y="162.0" width="624.0" height="84.0" fill="#fff" fill-opacity="1"/><text x="16" y="178" font-size="11.5" fill="#1c1c22" font-weight="bold">S2 sphere</text><text x="16" y="196" font-size="10" fill="#1c1c22">no repair</text><rect x="190.0" y="186.0" width="13.2" height="13.0" fill="#c7d7ee" fill-opacity="1"/><text x="207.1710485185264" y="196" font-size="10" fill="#1c1c22">0.37×</text><text x="16" y="215" font-size="10" fill="#1c1c22">in-line band (the default)</text><rect x="190.0" y="205.0" width="14.3" height="13.0" fill="#c7d7ee" fill-opacity="1"/><rect x="203.2" y="205.0" width="1.1" height="13.0" fill="#e08a10" fill-opacity="0.8"/><text x="208.29486226225558" y="215" font-size="10" fill="#1c1c22">0.40×</text><text x="16" y="234" font-size="10" fill="#1c1c22">0.5 px seam stroke (C1)</text><rect x="190.0" y="224.0" width="13.2" height="13.0" fill="#c7d7ee" fill-opacity="1"/><rect x="203.2" y="224.0" width="52.1" height="13.0" fill="#c0504d" fill-opacity="0.75"/><text x="259.24007368673426" y="234" font-size="10" fill="#1c1c22">1.85×</text><path d="M225.4 182 V242" stroke="#1c1c22" stroke-dasharray="3 3"/><rect x="8.0" y="254.0" width="624.0" height="84.0" fill="#fff" fill-opacity="1"/><text x="16" y="270" font-size="11.5" fill="#1c1c22" font-weight="bold">S3 grid</text><text x="16" y="288" font-size="10" fill="#1c1c22">no repair</text><rect x="190.0" y="278.0" width="177.5" height="13.0" fill="#c7d7ee" fill-opacity="1"/><text x="371.5179588653214" y="288" font-size="10" fill="#1c1c22">5.02×</text><text x="16" y="307" font-size="10" fill="#1c1c22">in-line band (the default)</text><rect x="190.0" y="297.0" width="198.7" height="13.0" fill="#c7d7ee" fill-opacity="1"/><rect x="367.5" y="297.0" width="21.2" height="13.0" fill="#e08a10" fill-opacity="0.8"/><text x="392.69712870596015" y="307" font-size="10" fill="#1c1c22">5.62×</text><text x="16" y="326" font-size="10" fill="#1c1c22">0.5 px seam stroke (C1)</text><rect x="190.0" y="316.0" width="177.5" height="13.0" fill="#c7d7ee" fill-opacity="1"/><rect x="367.5" y="316.0" width="222.5" height="13.0" fill="#c0504d" fill-opacity="0.75"/><text x="594" y="326" font-size="10" fill="#1c1c22">11.31×</text><path d="M225.4 274 V334" stroke="#1c1c22" stroke-dasharray="3 3"/><rect x="12.0" y="356.0" width="12.0" height="9.0" fill="#c7d7ee" fill-opacity="1"/><text x="30" y="364" font-size="10" fill="#1c1c22">the fills, welded</text><rect x="150.0" y="356.0" width="12.0" height="9.0" fill="#e08a10" fill-opacity="0.8"/><text x="168" y="364" font-size="10" fill="#1c1c22">what the band adds</text><rect x="300.0" y="356.0" width="12.0" height="9.0" fill="#c0504d" fill-opacity="0.75"/><text x="318" y="364" font-size="10" fill="#1c1c22">the seam stroke's second tessellation</text><text x="12" y="386" font-size="10" fill="#8a8a96">The frame is judged whole: on S2 the band keeps a still frame at 0.40× the buffer; the stroke puts it past 1.0 (§6.16).</text></svg>
